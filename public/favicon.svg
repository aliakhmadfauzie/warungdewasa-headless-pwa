<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="wd-shield" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Specular Glow Highlight -->
    <linearGradient id="wd-glow" x1="128" y1="48" x2="384" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Monogram Metallic Gold/Amber Gradient -->
    <linearGradient id="wd-monogram" x1="160" y1="140" x2="352" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Dark Inner Contrast Gradient -->
    <linearGradient id="wd-dark-inner" x1="256" y1="64" x2="256" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.96" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="wd-shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022C22" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#wd-shield)" filter="url(#wd-shadow)" />

  <!-- Inner Dark Surface -->
  <rect x="44" y="44" width="424" height="424" rx="108" fill="url(#wd-dark-inner)" stroke="url(#wd-glow)" stroke-width="4" />

  <!-- Top Glass Sheen -->
  <path d="M44 140 C 44 80, 80 44, 140 44 L 372 44 C 432 44, 468 80, 468 140 C 340 180, 180 180, 44 140 Z" fill="url(#wd-glow)" />

  <!-- Stylized "W" and "D" Dynamic Crest Monogram -->
  <g id="monogram-group">
    <!-- W Left Stem -->
    <path d="M120 180 L168 350 L208 350 L176 210 L152 210 Z" fill="url(#wd-monogram)" />
    <!-- W Center Peak & Right Stem -->
    <path d="M200 350 L256 195 L276 195 L232 350 Z" fill="url(#wd-monogram)" />
    <!-- W Right Diagonal -->
    <path d="M246 240 L288 350 L320 350 L300 280 L280 280 Z" fill="url(#wd-monogram)" />

    <!-- D Loop (Interlocking with W) -->
    <path d="M272 170 L340 170 C395 170 424 205 424 260 C424 315 395 350 340 350 L284 350 L296 312 L340 312 C372 312 386 292 386 260 C386 228 372 208 340 208 L284 208 Z" fill="url(#wd-monogram)" />

    <!-- Center Electric Spark / Official Star -->
    <path d="M256 120 L264 142 L286 150 L264 158 L256 180 L248 158 L226 150 L248 142 Z" fill="#FDE047" />

    <!-- Official Badge Ribbon Base -->
    <rect x="156" y="388" width="200" height="36" rx="18" fill="#059669" stroke="#34D399" stroke-width="2" />
    <text x="256" y="412" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="17" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">OFFICIAL</text>
  </g>
</svg>
